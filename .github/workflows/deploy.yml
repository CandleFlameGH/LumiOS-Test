name: Deploy to Wasmer

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v1

      - name: Deploy to Wasmer
        run: wasmer deploy
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
